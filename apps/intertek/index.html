<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 selection:bg-teal-500 selection:text-slate-950">
  <head>
    <meta charset="utf-8" />
    <title>Intertek | Total Quality Assurance & Inspection Services</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="Intertek is a leading Total Quality Assurance provider to industries worldwide. We offer comprehensive testing, inspection, and certification services." />
    <meta name="keywords" content="quality assurance, testing, inspection, certification, compliance, audit, safety testing, product certification" />
    <meta name="author" content="Intertek" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://intertek.example.com/" />
    <meta property="og:title" content="Intertek | Total Quality Assurance & Inspection Services" />
    <meta property="og:description" content="Deliver safety, quality, and performance excellence with Intertek's global testing, inspection, and certification solutions." />
    <meta property="og:image" content="https://intertek.example.com/assets/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Intertek | Total Quality Assurance" />
    <meta property="twitter:description" content="Comprehensive testing, inspection, and certification services." />
    <meta property="twitter:image" content="https://intertek.example.com/assets/og-image.jpg" />

    <!-- Structured Data (JSON-LD) for Local Business / Organization SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Intertek",
        "url": "https://intertek.example.com/",
        "logo": "https://intertek.example.com/assets/logo.png",
        "description": "Leading Total Quality Assurance provider to industries worldwide, offering testing, inspection, and certification services.",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+1-800-WORLD-QA",
          "contactType": "customer service"
        }
      }
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
