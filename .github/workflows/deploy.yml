name: CD - Deploy to cPanel via SSH

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SEO assets
        run: pnpm --dir apps/intertek run generate:seo
        env:
          BASE_PATH: ${{ secrets.DEPLOY_BASE_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Build production assets
        run: pnpm exec nx build intertek
        env:
          BASE_PATH: ${{ secrets.DEPLOY_BASE_PATH }}

      - name: Validate SSH deploy secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_REMOTE_DIR: ${{ secrets.SSH_REMOTE_DIR }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_REMOTE_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deploy secret::$name is required for the SSH deploy step."
              exit 1
            fi
          done

      - name: Upload build via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "apps/intertek/dist"
          target: ${{ secrets.SSH_REMOTE_DIR }}
          strip_components: 3

      - name: Upload DNS-AID zone file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "dns/intertekgroup.org.zone"
          target: ${{ secrets.SSH_REMOTE_DIR }}/dns
