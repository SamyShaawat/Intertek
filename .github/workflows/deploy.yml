name: CD - Deploy to cPanel/Hostinger

on:
  push:
    branches: [ main ] # Trigger deployment only when pushing/merging into 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production assets
        run: pnpm exec nx build intertek
        env:
          BASE_PATH: ${{ secrets.DEPLOY_BASE_PATH }} # Dynamic sub-path e.g. '/' or '/intertek/'

      - name: FTP/SFTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}          # FTP server host (e.g. ftp.example.com)
          username: ${{ secrets.FTP_USERNAME }}      # FTP user login credentials
          password: ${{ secrets.FTP_PASSWORD }}      # FTP password or SFTP key
          protocol: ftps                             # Use FTPS (explicit TLS) — prevents plaintext credential exposure
          local-dir: ./dist/apps/intertek/           # Nx built files local path
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}  # Destination folder on server (e.g., /public_html/intertek/)
          dangerous-clean-slate: false               # Keeps other folders/files intact for shared web app hosting
