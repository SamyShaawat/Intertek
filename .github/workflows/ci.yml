name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SEO assets
        run: pnpm --dir apps/intertek run generate:seo
        env:
          SITE_URL: https://intertekgroup.org

      - name: Verify linter rules
        run: pnpm exec nx lint intertek

      - name: Run unit tests
        run: pnpm exec nx test intertek

      - name: Build production assets
        run: pnpm exec nx build intertek
